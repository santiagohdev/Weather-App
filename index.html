<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather — Clima en tiempo real</title>
<meta name="description" content="App de clima en tiempo real con fondos animados que reaccionan a la condición actual, pronóstico horario, calidad del aire e índice UV.">
<meta name="theme-color" content="#0a0a12">

<meta property="og:type" content="website">
<meta property="og:title" content="Weather — Clima en tiempo real">
<meta property="og:description" content="Fondos cinematográficos animados que reaccionan al clima, pronóstico horario interpolado, calidad del aire e índice UV.">
<meta property="og:url" content="https://weather-app-santiago.vercel.app/">
<meta name="twitter:card" content="summary_large_image">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600&family=Geist+Mono:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

<canvas id="scene" aria-hidden="true"></canvas>

<!-- Estado de carga y errores. aria-live para que los lectores de pantalla
     anuncien el resultado de una búsqueda sin tener que buscarlo. -->
<div class="status" id="status" role="status" aria-live="polite">
  <span class="status__spin" aria-hidden="true"></span>
  <span id="statusText"></span>
</div>

<div id="app">
  <section id="hero">
    <div id="topbar">
      <div class="lw" id="langWrap">
        <button class="lb" id="langBtn" aria-label="Cambiar idioma" aria-haspopup="listbox"><span id="langFlag">🌐</span><span id="langName">EN</span><span class="la">›</span></button>
        <div class="ld" id="langDropdown"></div>
      </div>
      <div class="sw">
        <input class="si" id="searchInput" placeholder="Search any city..." autocomplete="off"
               aria-label="Buscar ciudad" role="combobox" aria-expanded="false" aria-controls="searchDropdown">
        <button class="sb" id="searchBtn" aria-label="Buscar">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><circle cx="8.5" cy="8.5" r="5.5" stroke="white" stroke-width="1.5"/><path d="M13 13L17 17" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <div class="sd" id="searchDropdown"></div>
      </div>
      <div class="ut">
        <button class="ub active" id="btnC" aria-label="Grados Celsius" aria-pressed="true">°C</button>
        <button class="ub" id="btnF" aria-label="Grados Fahrenheit" aria-pressed="false">°F</button>
      </div>
    </div>

    <div id="hero-center">
      <div class="hc-loc"><div class="ldot"></div><span id="cityLabel">—</span><span id="countryLabel" style="opacity:.35;margin-left:2px"></span></div>
      <div class="hc-temp fu" id="mainTemp">—</div>
      <div class="hc-cond" id="mainCond">—</div>
      <div class="hc-hl"><span id="mainH">—</span><span style="opacity:.25;margin:0 5px">·</span><span id="mainL">—</span></div>
    </div>

    <div id="hero-bot">
      <div class="wv" id="weatherVisual"></div>
      <div class="sh"><span id="scrollHint">scroll</span><div class="sha">↓</div></div>
    </div>

    <!-- Hero quick stats pills -->
    <div id="hero-stats">
      <div class="hs-pill">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 2a5 5 0 0 1 5 5c0 4-5 11-5 11S7 11 7 7a5 5 0 0 1 5-5z"/><circle cx="12" cy="7" r="2"/></svg>
        <span class="hs-lbl" id="hs-lbl-feels">Feels</span>
        <span class="hs-val" id="hs-feels">—</span>
      </div>
      <div class="hs-pill">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></svg>
        <span class="hs-lbl" id="hs-lbl-wind">Wind</span>
        <span class="hs-val" id="hs-wind">—</span>
      </div>
      <div class="hs-pill" id="hs-rain-pill">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M20 17.58A5 5 0 0 0 18 8h-1.26A8 8 0 1 0 4 16.25M8 16h.01M8 20h.01M12 18h.01M12 22h.01M16 16h.01M16 20h.01"/></svg>
        <span class="hs-lbl">Rain</span>
        <span class="hs-val" id="hs-rain">—</span>
      </div>
      <div class="hs-pill">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 2a5 5 0 0 1 5 5c0 4-5 11-5 11S7 11 7 7a5 5 0 0 1 5-5z"/></svg>
        <span class="hs-lbl">Humidity</span>
        <span class="hs-val" id="hs-hum">—</span>
      </div>
    </div>

    <!-- Hero hourly bar -->
    <div id="hero-hourly">
      <div class="hh-wrap">
        <button class="hh-arrow" id="hhPrev" aria-label="Horas anteriores">‹</button>
        <div class="hh-scroll" id="hhScroll"></div>
        <button class="hh-arrow" id="hhNext" aria-label="Horas siguientes">›</button>
      </div>
    </div>

    <div id="cities-row">
      <div class="saved-list" id="savedList"></div>
    </div>
  </section>

  <section id="details">
    <div class="qstats glass">
      <div class="qi">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
        <div class="qi-lbl" id="lbl-feels">Real feel</div>
        <div class="qi-val" id="diFeels">—</div>
        <div class="qi-sub" id="diFeelsSub">—</div>
      </div>
      <div class="qi">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 1 5 5c0 4-5 11-5 11S7 11 7 7a5 5 0 0 1 5-5z"/><circle cx="12" cy="7" r="2"/></svg>
        <div class="qi-lbl" id="lbl-hum">Humidity</div>
        <div class="qi-val" id="diHum">—</div>
        <div class="qi-sub" id="diHumSub">—</div>
      </div>
      <div class="qi">
        <svg class="icon" viewBox="0 0 24 24"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></svg>
        <div class="qi-lbl" id="lbl-wind">Wind</div>
        <div class="qi-val" id="diWind">—</div>
        <div class="qi-sub" id="diWindSub">—</div>
      </div>
      <div class="qi">
        <svg class="icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <div class="qi-lbl" id="lbl-vis">Visibility</div>
        <div class="qi-val" id="diVis">—</div>
        <div class="qi-sub" id="diVisSub">—</div>
      </div>
    </div>

    <div class="block glass">
      <div class="blbl" id="lbl-hourly">Hourly forecast</div>
      <div class="hourly-outer">
        <div class="hscroll" id="hourlyRow"></div>
      </div>
    </div>

    <div class="block glass">
      <div class="blbl" id="lbl-7day">7-day forecast</div>
      <div id="forecastList"></div>
      <div id="dayDetail" style="display:none"></div>
    </div>

    <div class="bgrid">
      <div class="block glass">
        <div class="blbl" id="lbl-aqi">Air quality</div>
        <div class="aqi-top"><div class="aqi-n" id="aqiNum">—</div><div class="aqi-s"><div class="aqi-w" id="aqiWord">—</div><div class="aqi-u">AQI</div></div></div>
        <div class="aqi-tr"><div class="aqi-dot" id="aqiDot" style="left:0%"></div></div>
        <div class="aqi-sc"><span>0</span><span>100</span><span>200</span><span>300</span><span>400+</span></div>
      </div>
      <div class="block glass">
        <div class="blbl" id="lbl-sun">Sun</div>
        <div class="sun-row">
          <div class="sun-i"><div class="sun-l" id="lbl-sunrise">Sunrise</div><div class="sun-v" id="sunriseVal">—</div></div>
          <div class="sun-i"><div class="sun-l" id="lbl-sunset">Sunset</div><div class="sun-v" id="sunsetVal">—</div></div>
        </div>
        <svg class="sun-arc" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
          <defs><filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
          <path class="arc-t" d="M10,70 Q100,-10 190,70"/>
          <path class="arc-f" id="arcFill" d="M10,70 Q100,-10 190,70"/>
          <circle class="arc-d" id="arcDot" cx="10" cy="70" r="5" filter="url(#glow)"/>
        </svg>
        <div class="dl" id="dayLength">—</div>
      </div>
      <div class="block glass">
        <div class="blbl" id="lbl-uv">UV Index</div>
        <div class="uv-n" id="uvNum">—</div>
        <div class="uv-d" id="uvWord">—</div>
        <div class="uv-s" id="uvSub">—</div>
        <div class="uv-bar"></div>
        <div class="uv-sc"><span>Low</span><span>Moderate</span><span>High</span><span>Extreme</span></div>
      </div>
    </div>
  </section>
</div>
<script src="script.js"></script>
</body>
</html>
